name: Monthly Prayer Times Update
on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and run scraper
        shell: pwsh
        run: |
          $encoded = '${{ secrets.SCRAPER_SCRIPT }}'
          $bytes = [Convert]::FromBase64String($encoded)
          $script = [Text.Encoding]::UTF8.GetString($bytes)
          $script | Out-File -FilePath scraper.ps1 -Encoding UTF8
          ./scraper.ps1
      - name: Commit and push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --staged --quiet || (git commit -m "Auto-update: $(date +'%B %Y')" && git push)
