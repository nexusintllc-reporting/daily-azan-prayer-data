name: Monthly Prayer Times Update
on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Combine and run scraper
        shell: pwsh
        run: |
          # Decode cities part 1
          $cities1 = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String("${{ secrets.CITIES_PART1 }}"))
          # Decode cities part 2
          $cities2 = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String("${{ secrets.CITIES_PART2 }}"))
          # Combine
          $allCities = "`$cities = @(`n" + $cities1 + $cities2 + "`n)"
          
          # Decode scraper logic
          $scraper = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String("${{ secrets.SCRAPER_SCRIPT }}"))
          # Replace placeholder with actual cities
          $scraper = $scraper -replace '###CITIES_PLACEHOLDER###', $allCities
          
          # Save and run
          $scraper | Out-File -FilePath scraper.ps1 -Encoding UTF8
          ./scraper.ps1
          
      - name: Commit and push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --staged --quiet || (git commit -m "Auto-update: $(date +'%B %Y')" && git push)
