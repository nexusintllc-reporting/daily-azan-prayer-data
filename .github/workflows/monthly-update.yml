name: Monthly Prayer Times Update
on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Combine and run scraper
        shell: pwsh
        run: |
          $part1 = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String("${{ secrets.CITIES_PART1 }}"))
          $part2 = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String("${{ secrets.CITIES_PART2 }}"))
          $citiesBlock = $part1 + $part2
          $scraper = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String("${{ secrets.SCRAPER_SCRIPT }}"))
          $finalScript = $scraper.Replace('###CITIES_PLACEHOLDER###', $citiesBlock)
          $finalScript | Out-File -FilePath scraper.ps1 -Encoding UTF8
          Write-Host "Running scraper..."
          pwsh -File scraper.ps1
          
      - name: Commit and push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --staged --quiet || (git commit -m "Auto-update: $(date +'%B %Y')" && git push)
